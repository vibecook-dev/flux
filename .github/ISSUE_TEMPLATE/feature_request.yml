name: Feature request
description: Suggest an idea or an improvement for flux.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you're trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Workarounds, other tools, or other ways flux could do this.
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Your setup (server OS, clients, library size), links, mock-ups.
