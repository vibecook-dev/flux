# Weekly dependency updates, one grouped pull request per ecosystem for minor
# and patch bumps; major bumps arrive as their own pull requests. Version
# updates wait until a release is a week old (`cooldown`), so a compromised
# release is usually yanked before it reaches a PR; security updates don't
# wait.
#
# The commit message decides whether a bump makes a release
# (docs/RELEASING.md). What ships in the packages or the image is
# "deps: …", which does. npm development dependencies are "chore: …" and
# GitHub Actions "ci(deps): …", which don't. Dependabot treats every cargo
# dependency as a production one (it doesn't support prefix-development for
# cargo), so every cargo bump is "deps:", dev-dependencies and
# web/scripts/golden-rs included.
version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /web/scripts/golden-rs
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - rust
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]

  # Production and development dependencies are grouped apart, so that a PR
  # of development bumps only stays "chore:".
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      prefix-development: chore
    labels:
      - dependencies
      - javascript
    groups:
      npm:
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]

  # The debian:trixie-slim digest in the Dockerfile's FROM lines.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
      - ci
    groups:
      github-actions:
        patterns: ["*"]
