# Builds flux release packages: the web bundle once, THIRD_PARTY_LICENSES
# once, then flux-server per target, packaged by scripts/package/package.sh as
# flux-<version>-<target>.tar.gz (.zip for Windows). Called by release.yml
# (all targets) and docker.yml (Linux only). Uploads one artifact per target,
# named package-<target>, holding that package.
#
# No caches: these packages are published (releases, the :edge image), so
# they are built from the lockfiles alone, never from a cache another
# workflow run could have written (cache poisoning). ci.yml keeps its caches.
name: Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (default the caller's commit).
        type: string
        default: ""
      version:
        description: Version in the package names; empty means "dev".
        type: string
        default: ""
      targets:
        description: '"all" or "linux".'
        type: string
        default: all
      require-sidecar:
        description: Fail when a package can't bundle Truffle's sidecar (releases); otherwise it is only a warning.
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_TOOLCHAIN: "1.99.1"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  web:
    name: Web bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # LTS
          package-manager-cache: false
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build for flux-server (same-origin API)
        working-directory: web
        env:
          VITE_FLUX_API: /
        run: pnpm build
      - name: Licences of the bundled npm packages
        run: node scripts/package/web-licenses.mjs web > web-licenses.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-licenses
          path: web-licenses.txt
          if-no-files-found: error
          retention-days: 7

  licenses:
    name: Third-party licences
    needs: web
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-licenses
      - name: Generate THIRD_PARTY_LICENSES
        run: |
          cargo fetch --locked
          scripts/package/third-party-licenses.sh --web web-licenses.txt --out THIRD_PARTY_LICENSES
          echo "THIRD_PARTY_LICENSES: $(wc -l < THIRD_PARTY_LICENSES) lines" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES
          if-no-files-found: error
          retention-days: 7

  plan:
    name: Plan targets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      include: ${{ steps.plan.outputs.include }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        env:
          TARGETS: ${{ inputs.targets }}
          VERSION: ${{ inputs.version }}
        run: |
          # Linux builds run on Ubuntu 22.04 runners, so the binaries need
          # glibc 2.35 or newer. macOS x86_64 is cross-compiled on arm64 and
          # smoke-tested there under Rosetta 2. Windows is built with MSVC and
          # packaged as a .zip.
          all='[
            {"target":"aarch64-apple-darwin","os":"macos-15","native":true},
            {"target":"x86_64-apple-darwin","os":"macos-15","native":false,"rosetta":true},
            {"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","native":true},
            {"target":"aarch64-unknown-linux-gnu","os":"ubuntu-22.04-arm","native":true},
            {"target":"x86_64-pc-windows-msvc","os":"windows-2025","native":true}
          ]'
          case "$TARGETS" in
            all) include=$(jq -c . <<< "$all") ;;
            linux) include=$(jq -c 'map(select(.target | endswith("-linux-gnu")))' <<< "$all") ;;
            *) echo "::error::targets must be 'all' or 'linux', got '$TARGETS'"; exit 1 ;;
          esac
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION:-dev}" >> "$GITHUB_OUTPUT"

  binaries:
    name: Package ${{ matrix.target }}
    needs: [plan, web, licenses]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # Git Bash on Windows, so every target runs the same scripts.
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TARGET: ${{ matrix.target }}
      # File names on Windows: flux-server.exe, sidecar-slim.exe, a .zip.
      EXE: ${{ contains(matrix.target, '-windows-') && '.exe' || '' }}
      PACKAGE: flux-${{ needs.plan.outputs.version }}-${{ matrix.target }}.${{ contains(matrix.target, '-windows-') && 'zip' || 'tar.gz' }}
      # Distributed binaries: no debug info, symbols kept for backtraces.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_STRIP: debuginfo
      # Windows: the C runtime linked into flux-server.exe. Windows doesn't
      # include vcruntime140.dll (the Visual C++ Redistributable does), so a
      # dynamically linked exe fails to start on a fresh install. The runner
      # has the DLL, so the smoke test reads the imports instead
      # (pe-imports.py). Cargo reads this only when building for that target.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # jemalloc bakes in the page size. 64 KiB covers 4, 16 and 64 KiB
      # kernels (Raspberry Pi 5 and Asahi use 16 KiB); tikv-jemalloc-sys reads
      # this target-prefixed variable only when building for that target.
      AARCH64_UNKNOWN_LINUX_GNU_JEMALLOC_SYS_WITH_LG_PAGE: "16"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Truffle sidecar
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRE_SIDECAR: ${{ inputs.require-sidecar }}
        run: |
          scripts/package/fetch-sidecar.sh --target "$TARGET" --out sidecar
          if [ "$REQUIRE_SIDECAR" = true ] && [ ! -f "sidecar/sidecar-slim$EXE" ]; then
            echo "::error title=No Truffle sidecar::A release must bundle Truffle's sidecar; see the warning above and docs/RELEASING.md."
            exit 1
          fi
      - name: Build flux-server and the flux command line
        run: cargo build --locked --release -p flux-server -p flux-cli --target "$TARGET"
      # Developer ID signing and Apple's notarization, when the repository has
      # the Apple secrets (docs/RELEASING.md, Signing); a warning until then.
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_API_KEY" ]; then
            echo "::warning title=macOS binaries not signed::Add the Apple secrets to sign and notarize them (docs/RELEASING.md, Signing)."
            exit 0
          fi
          files=("$CARGO_TARGET_DIR/$TARGET/release/flux-server" "$CARGO_TARGET_DIR/$TARGET/release/flux")
          if [ -f sidecar/sidecar-slim ]; then files+=(sidecar/sidecar-slim); fi
          scripts/package/macos-sign.sh "${files[@]}"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
      - name: Package
        run: |
          args=(--target "$TARGET" --version "$VERSION"
                --bin "$CARGO_TARGET_DIR/$TARGET/release/flux-server$EXE"
                --cli "$CARGO_TARGET_DIR/$TARGET/release/flux$EXE"
                --web web-dist --third-party THIRD_PARTY_LICENSES --out dist)
          if [ -f "sidecar/sidecar-slim$EXE" ]; then args+=(--sidecar "sidecar/sidecar-slim$EXE"); fi
          scripts/package/package.sh "${args[@]}"
      # The x86_64 macOS package runs under Rosetta 2 on the arm64 runner.
      # Show that Rosetta translates here, installing it if the runner image
      # lacks it, rather than skip the test.
      - name: Rosetta 2
        if: matrix.rosetta
        run: |
          if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            echo "Rosetta 2 is not installed; installing it."
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          translated=$(arch -x86_64 /usr/sbin/sysctl -n sysctl.proc_translated)
          echo "arch -x86_64: uname -m $(arch -x86_64 /usr/bin/uname -m), sysctl.proc_translated $translated"
          if [ "$translated" != 1 ]; then
            echo "::error::arch -x86_64 does not run under Rosetta 2 on this runner."
            exit 1
          fi
      # On Windows the test stops flux with Ctrl-C, then Ctrl-Break, as a
      # service wrapper would (scripts/package/windows-console.ps1).
      - name: Smoke test${{ matrix.rosetta && ' (Rosetta 2)' || '' }}
        if: matrix.native || matrix.rosetta
        run: scripts/package/smoke-test.sh "dist/$PACKAGE" --port 18097
      # The .deb and .rpm, made from the tarball by a pinned nFPM
      # (scripts/package/linux-packages.sh; none for a "dev" build).
      - name: Linux packages (.deb, .rpm)
        if: contains(matrix.target, '-linux-')
        env:
          NFPM_VERSION: "2.48.0"
        run: |
          case "$(uname -m)" in
            x86_64) asset="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" sha=6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750 ;;
            aarch64) asset="nfpm_${NFPM_VERSION}_Linux_arm64.tar.gz" sha=a9a75213763783b7669719e505474c748c5ad7dc66591a195619deb50f85c2f4 ;;
            *) echo "::error::no nFPM for $(uname -m)"; exit 1 ;;
          esac
          curl -fsSL --retry 3 --proto '=https' -o "$RUNNER_TEMP/$asset" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/$asset"
          (cd "$RUNNER_TEMP" && echo "$sha  $asset" | sha256sum -c - && tar -xzf "$asset" nfpm)
          scripts/package/linux-packages.sh --tarball "dist/$PACKAGE" --out dist --nfpm "$RUNNER_TEMP/nfpm"
      # Installed in Debian, Fedora and AlmaLinux containers, then removed.
      - name: Smoke test the .deb and .rpm
        if: contains(matrix.target, '-linux-')
        run: |
          if ! ls dist/*.deb > /dev/null 2>&1; then echo "No .deb or .rpm (a dev build)."; exit 0; fi
          scripts/package/linux-smoke-test.sh --dist dist --version "$VERSION"
      - name: Summary
        run: |
          {
            echo "### flux-$VERSION-$TARGET"
            echo '```'
            ls -l dist/
            if [ -n "$EXE" ]; then
              python scripts/package/zip.py list "dist/$PACKAGE" | grep -v '/web/.' || true
            else
              tar -tzf "dist/$PACKAGE" | grep -v '/share/flux/web/.' || true
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.target }}
          path: |
            dist/${{ env.PACKAGE }}
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
