# Builds and publishes one release: packages for five targets, SHA256SUMS,
# build-provenance attestations, the Docker image, then flips the draft
# release that Release Please created to published. Called by
# release-please.yml; run it by hand (Actions → Release → Run workflow) to
# rebuild a draft release after a failure. It refuses a release that is
# already published, before building anything: published releases are
# immutable. release-dry-run.yml runs the same build and packaging without
# publishing anything.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (v<version>).
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a draft release to build and publish, e.g. v0.1.0-alpha.2
        type: string
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  # Only a draft release may be built and published. A published release is
  # immutable: GitHub rejects new or replaced assets, so a run against one
  # would build everything and then fail, and it could push the image.
  draft:
    name: Check the ${{ inputs.tag }} draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # only a token with push access sees draft releases
    steps:
      - name: Check the release is a draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            echo "::error title=No release for $TAG::gh found no GitHub release for $TAG (its error is above). This workflow builds and publishes the draft release that Release Please creates; it never creates one (docs/RELEASING.md)."
            exit 1
          fi
          if [ "$draft" != true ]; then
            echo "::error title=$TAG is already published::$TAG is a published release, and published releases can't change (immutable releases), so nothing was built. To ship a fix, land it on main and release the next version (docs/RELEASING.md, When something fails)."
            exit 1
          fi
          echo "$TAG is a draft release." >> "$GITHUB_STEP_SUMMARY"

  prepare:
    name: Check ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - id: check
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Release tags look like v0.1.0, got '$TAG'."; exit 1 ;;
          esac
          version=${TAG#v}
          cargo=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          web=$(jq -r .version web/package.json)
          if [ "$cargo" != "$version" ] || [ "$web" != "$version" ]; then
            echo "::error::$TAG does not match Cargo.toml ($cargo) and web/package.json ($web)."
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "ref=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing **$TAG** (prerelease: $prerelease) from \`$(git rev-parse HEAD)\`." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: [draft, prepare]
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    # The signing secrets (Apple's; Azure's for Windows).
    secrets: inherit
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      targets: all
      # A package without the sidecar can't run --tailnet embedded: fail the
      # build, so nothing is uploaded, pushed or published.
      require-sidecar: true

  assets:
    name: Upload assets
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # upload release assets
      id-token: write # Sigstore signing of the attestation
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      # Checks every target's package is there, adds the source of the GPL
      # jellyfin-ffmpeg in the Docker image, and writes SHA256SUMS.
      - name: Source tarball and SHA256SUMS
        run: |
          scripts/package/release-assets.sh --version "$VERSION" dist
          { echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # No storage record (see docker.yml): actions/attest only makes one for
      # an image pushed to a registry, so this is the default made explicit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/flux-*.tar.gz
            dist/flux-*.zip
            dist/flux-*.deb
            dist/flux-*.rpm
          create-storage-record: false
      # --clobber replaces the assets an earlier, failed run of this draft
      # uploaded. Check again that it is still a draft: it may have been
      # published by hand since the `draft` job ran.
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::error title=$TAG is already published::$TAG was published while this run was building; not uploading to it."
            exit 1
          fi
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  docker:
    name: Docker
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
      ref: ${{ needs.prepare.outputs.ref }}

  publish:
    name: Publish ${{ inputs.tag }}
    needs: [prepare, assets, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          latest=true
          if [ "$PRERELEASE" = "true" ]; then latest=false; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$PRERELEASE" --latest="$latest"
          url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Published $url" >> "$GITHUB_STEP_SUMMARY"

  # The Homebrew formula (vibecook-dev/homebrew-tap, Formula/flux.rb), once
  # the release is public: its downloads are what the formula points at.
  # Needs the HOMEBREW_TAP_TOKEN secret (docs/RELEASING.md, Homebrew). A
  # pre-release doesn't replace a stable version there.
  homebrew:
    name: Homebrew tap
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Without a tap token
        if: env.TAP_TOKEN == ''
        run: echo "::notice title=Homebrew tap not updated::Add a HOMEBREW_TAP_TOKEN secret to update vibecook-dev/homebrew-tap at each release (docs/RELEASING.md, Homebrew)."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.TAP_TOKEN != ''
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - name: Update Formula/flux.rb
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D "$RUNNER_TEMP"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/vibecook-dev/homebrew-tap.git" "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/flux.rb 2> /dev/null || true)
          case "$current" in
            *-* | "") ;;
            *)
              case "$VERSION" in
                *-*) echo "The tap has flux $current; $VERSION is a pre-release, so it stays."; exit 0 ;;
              esac
              ;;
          esac
          mkdir -p Formula
          "$GITHUB_WORKSPACE/scripts/package/homebrew-formula.sh" --version "$VERSION" --sums "$RUNNER_TEMP/SHA256SUMS" > Formula/flux.rb
          if git diff --quiet; then echo "Formula/flux.rb has flux $VERSION already."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/flux.rb
          git commit -m "flux $VERSION"
          git push origin HEAD
          echo "Homebrew: vibecook-dev/tap/flux is $VERSION" >> "$GITHUB_STEP_SUMMARY"
