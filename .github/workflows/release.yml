# Builds and publishes one release: packages for four targets, SHA256SUMS,
# build-provenance attestations, the Docker image, then flips the draft
# release that Release Please created to published. Called by
# release-please.yml; run it by hand (Actions → Release → Run workflow) to
# rebuild an existing tag after a failure. release-dry-run.yml runs the same
# build and packaging without publishing anything.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (v<version>).
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish, e.g. v0.1.0-alpha.1
        type: string
        required: true

permissions: {}

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Check ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      ref: ${{ steps.check.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - id: check
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::Release tags look like v0.1.0, got '$TAG'."; exit 1 ;;
          esac
          version=${TAG#v}
          cargo=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          web=$(jq -r .version web/package.json)
          if [ "$cargo" != "$version" ] || [ "$web" != "$version" ]; then
            echo "::error::$TAG does not match Cargo.toml ($cargo) and web/package.json ($web)."
            exit 1
          fi
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "ref=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing **$TAG** (prerelease: $prerelease) from \`$(git rev-parse HEAD)\`." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      version: ${{ needs.prepare.outputs.version }}
      targets: all
      # A package without the sidecar can't run --tailnet embedded: fail the
      # build, so nothing is uploaded, pushed or published.
      require-sidecar: true

  assets:
    name: Upload assets
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # upload release assets
      id-token: write # Sigstore signing of the attestation
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      # Checks every target's package is there, adds the source of the GPL
      # jellyfin-ffmpeg in the Docker image, and writes SHA256SUMS.
      - name: Source tarball and SHA256SUMS
        run: |
          scripts/package/release-assets.sh --version "$VERSION" dist
          { echo '```'; cat dist/SHA256SUMS; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/flux-*.tar.gz
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  docker:
    name: Docker
    needs: [prepare, build]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
      ref: ${{ needs.prepare.outputs.ref }}

  publish:
    name: Publish ${{ inputs.tag }}
    needs: [prepare, assets, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          latest=true
          if [ "$PRERELEASE" = "true" ]; then latest=false; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease="$PRERELEASE" --latest="$latest"
          url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Published $url" >> "$GITHUB_STEP_SUMMARY"
