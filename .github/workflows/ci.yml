name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  # Release Please's PR comes from github-actions[bot], which counts as a
  # first-time contributor, so the PR's own pull_request runs wait for
  # approval; release-please.yml also dispatches this workflow on the
  # release branch (docs/RELEASING.md).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUST_BACKTRACE: short
  # Lints and tests run on a pinned toolchain so a new stable release can't
  # turn main red overnight. Bump it in a PR of its own (docs/RELEASING.md).
  RUST_TOOLCHAIN: "1.99.1"
  # A developer's .cargo/config.toml may point target-dir at a local disk.
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # The synthetic-clip tests skip themselves without ffmpeg, ffprobe or
      # an encoder they need. Here that would hide a broken runner, so
      # crates/flux-test-media/tests/required_tools.rs fails instead.
      FLUX_TEST_REQUIRE_FFMPEG: "1"
      # crates/flux-server/tests/service.rs installs flux as a service of the
      # runner (a LaunchAgent, a systemd user unit), which only a throwaway
      # machine should get.
      FLUX_TEST_SERVICES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # PR caches would evict main's from the 10 GB budget.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The synthetic-clip tests run ffmpeg/ffprobe. Ubuntu's ffmpeg has
      # libx264; Homebrew's has libx264 and VideoToolbox. Tests that need the
      # media corpus skip themselves unless FLUX_TEST_MEDIA is set.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ffmpeg
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
        run: brew install ffmpeg
      # The runner's user has no systemd user manager until it lingers, and
      # `flux-server service` installs a user unit (tests/service.rs).
      - name: systemd user manager (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user show-environment > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "::error::the systemd user manager didn't start"
          exit 1
      - name: Record toolchain and ffmpeg
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo '```'
            rustc --version
            ffmpeg -hide_banner -version | sed -n 1p
            echo "H.264 encoders: $(ffmpeg -hide_banner -encoders 2>/dev/null | awk '$2 ~ /^(libx264|h264_)/ {print $2}' | paste -sd ' ' -)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # GitHub's macOS VM passes VideoToolbox's test encode, but its
      # virtualized encoder has flushed a run one frame short (287 of 288
      # in phase_d's vfr_transcode_keeps_every_frame), so the macOS tests
      # transcode with libx264. VideoToolbox is checked on Apple hardware
      # (docs/ENCODERS.md); the step after this one shows what flux picks.
      # Normally ~5 min; a hung test fails here instead of holding the
      # runner (and this branch's CI queue) for the job's full hour.
      - name: Test
        id: test
        timeout-minutes: 25
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export FLUX_VIDEO_ENCODER=libx264; fi
          cargo test --locked --workspace
      # Which ffmpeg tools and H.264 encoder this runner gives flux (the
      # transcode tests use the same detection).
      - name: Media tools (flux-server --check)
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        run: |
          {
            echo "### flux-server --check (${{ matrix.os }})"
            echo '```'
            cargo run --locked -q -p flux-server -- --check 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  # Windows: lints and tests with the MSVC toolchain, then the release
  # build that build.yml packages as a .zip. ffmpeg is Jellyfin's portable
  # win64 build, pinned by checksum.
  windows:
    name: Rust (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      # As on Linux and macOS: no ffmpeg or encoder fails the run instead of
      # skipping the synthetic-clip tests. The runner has no GPU, so flux
      # picks libx264 after the NVENC and Quick Sync test encodes fail.
      FLUX_TEST_REQUIRE_FFMPEG: "1"
      # tests/service.rs installs flux as a Windows service (the runner is an
      # administrator, and thrown away after the run).
      FLUX_TEST_SERVICES: "1"
      # The C runtime linked in, as build.yml builds the release exe (which
      # then needs no Visual C++ Redistributable), so lints, tests and the
      # release build below use the same CRT as the package.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C target-feature=+crt-static"
      # The version the Docker image bundles (JELLYFIN_FFMPEG_VERSION in the
      # Dockerfile); the SHA-256 is the release asset's digest. Bump both
      # with the Dockerfile.
      JELLYFIN_FFMPEG_VERSION: "8.1.3-1"
      JELLYFIN_FFMPEG_WIN64_SHA256: 3691f8b2d4c39c511b5faff1c8c4687bd782dac823e63ba69f0755f7ce1af9ce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install jellyfin-ffmpeg
        run: |
          zip="jellyfin-ffmpeg_${JELLYFIN_FFMPEG_VERSION}_portable_win64-clang-gpl.zip"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 --proto '=https' -o "$zip" \
            "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v${JELLYFIN_FFMPEG_VERSION}/$zip"
          echo "${JELLYFIN_FFMPEG_WIN64_SHA256}  $zip" | sha256sum -c -
          python "$GITHUB_WORKSPACE/scripts/package/zip.py" extract "$zip" jellyfin-ffmpeg
          cygpath -w "$PWD/jellyfin-ffmpeg" >> "$GITHUB_PATH"
      - name: Record toolchain and ffmpeg
        run: |
          {
            echo "### windows-2025"
            echo '```'
            rustc --version
            ffmpeg -hide_banner -version | sed -n 1p
            echo "H.264 encoders: $(ffmpeg -hide_banner -encoders 2>/dev/null | awk '$2 ~ /^(libx264|h264_)/ {print $2}' | paste -sd ' ' -)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Normally ~10 min with the build; a hung test fails here instead of
      # holding the runner for the job's full time.
      - name: Test
        id: test
        timeout-minutes: 45
        run: cargo test --locked --workspace
      - name: Media tools (flux-server --check)
        if: ${{ !cancelled() && steps.test.conclusion != 'skipped' }}
        run: |
          {
            echo "### flux-server --check (windows-2025)"
            echo '```'
            cargo run --locked -q -p flux-server -- --check 2>&1 || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # The release profile (thin LTO) that build.yml packages.
      - name: Release build of flux-server
        run: cargo build --locked --release -p flux-server
      # The runner has the Visual C++ Redistributable, so running the exe
      # can't show it needs one; its import table can.
      - name: flux-server.exe needs no Visual C++ Redistributable
        run: python scripts/package/pe-imports.py --no-vc-redist "$CARGO_TARGET_DIR/release/flux-server.exe"

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: |
          v=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "MSRV: \`$v\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked --workspace

  web:
    name: Web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Version from web/package.json "packageManager".
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # LTS
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Build (as served by flux-server)
        env:
          VITE_FLUX_API: /
        run: pnpm build
      - name: Bundle size
        run: |
          {
            echo "### Web bundle"
            echo '```'
            du -sh dist
            find dist -type f \( -name '*.js' -o -name '*.css' \) -exec du -k {} + | sort -rn | sed -n 1,10p
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The TypeScript API mirror is checked against flux-core's serde output.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: web/scripts/golden-rs -> ../../../target
          key: golden
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: golden-rs builds against flux-core
        working-directory: web/scripts/golden-rs
        run: cargo check --locked
      - name: Golden samples are current
        run: |
          node scripts/gen-golden.mjs
          if ! git diff --exit-code -- src/api/__golden__; then
            echo "::error::src/api/__golden__ is stale: run 'pnpm golden' and commit the result."
            exit 1
          fi

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2
      - name: Licences, bans and sources
        run: cargo deny --locked check licenses bans sources
      - name: Advisories
        run: cargo deny --locked check advisories

  lint:
    name: Lint workflows, scripts and Dockerfile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      HADOLINT_VERSION: "2.15.1"
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint and hadolint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz -C bin actionlint
          curl -fsSLo bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  bin/hadolint" | sha256sum -c -
          chmod +x bin/hadolint
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # actionlint also runs shellcheck (preinstalled) on every `run:` block.
      - name: actionlint
        run: actionlint -color
      - name: shellcheck
        run: shellcheck --severity=style scripts/package/*.sh scripts/package/linux/*.sh
      # scripts/package/test_*.py, on synthetic inputs (pe-imports.py).
      - name: Packaging script tests
        run: python3 -m unittest discover -s scripts/package -p 'test_*.py' -v
      - name: hadolint
        run: hadolint Dockerfile

  # One stable check for branch protection: it fails if any job above did.
  ci-ok:
    name: CI OK
    if: always()
    needs: [fmt, rust, windows, msrv, web, deny, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## CI"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"
          if jq -e 'to_entries | any(.value.result != "success")' <<< "$NEEDS" > /dev/null; then
            echo "::error::A CI job failed or was cancelled; see the table in the summary."
            exit 1
          fi
