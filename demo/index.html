    <script>
      // Resolve the theme before first paint (no flash), and colour the browser's
      // (or the installed app's) title bar to match. Setting lives in localStorage.
      (function () {
        var s = 'system';
        try {
          s = localStorage.getItem('flux.theme') || 'system';
        } catch (e) {}
        var dark = s === 'dark' || (s === 'system' && !matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var bars = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < bars.length; i++) bars[i].content = dark ? '#0b0b0e' : '#ebeaee';
      })();
    </script>
