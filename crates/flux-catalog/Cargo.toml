[package]
name = "flux-catalog"
description = "SQLite catalog: schema, single batched writer, read queries for the API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
flux-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `spawn_blocking` for the async read API.
tokio = { workspace = true }
# Bounded MPMC channel with both blocking (writer thread, `recv_timeout`) and
# async (`send_async`/`recv_async`) ends: the writer is a std thread, producers
# are tokio tasks or plain threads.
flume = { version = "0.12", default-features = false, features = ["async"] }

[dev-dependencies]
tempfile = "3.27"
# Corpus location (FLUX_TEST_MEDIA) for the real-media tests.
flux-test-media = { path = "../flux-test-media" }

[[bin]]
name = "catalog-bench"
path = "src/bin/catalog-bench.rs"
