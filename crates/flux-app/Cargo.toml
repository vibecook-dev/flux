[package]
name = "flux-app"
description = "flux.app: flux on a Mac, from the menu bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "flux-app"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Only the classes the app uses (each framework crate's default is all of them).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSDate",
    "NSEnumerator",
    "NSError",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSTimer",
    "NSURL",
    "NSUserDefaults",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "libc",
    "objc2-core-foundation",
    "NSAlert",
    "NSApplication",
    "NSButton",
    "NSCell",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-service-management = { version = "0.3", default-features = false, features = [
    "std",
    "SMAppService",
    "objc2",
    "objc2-foundation",
] }

[dev-dependencies]
tempfile = "3.27"
