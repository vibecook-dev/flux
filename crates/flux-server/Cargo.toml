[package]
name = "flux-server"
description = "flux media server binary: HTTP API, media delivery, background jobs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "flux-server"
path = "src/main.rs"

[features]
default = ["jemalloc"]
# Global allocator of the binary: jemalloc for Rust and SQLite, returning
# freed memory (src/alloc.rs; docs/prototype/server.md "Phase E: memory").
# `--no-default-features` builds with the system allocator. Not on Windows.
jemalloc = ["dep:tikv-jemallocator", "dep:tikv-jemalloc-sys", "dep:rusqlite"]

[dependencies]
flux-core = { workspace = true, features = ["schema"] }
flux-catalog.workspace = true
flux-scan.workspace = true
flux-hls.workspace = true
flux-meta.workspace = true
flux-net.workspace = true

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
futures.workspace = true
axum.workspace = true
tower.workspace = true
xxhash-rust.workspace = true
reqwest.workspace = true

clap = { version = "4.6", features = ["derive", "env"] }
toml = "1.1"
sha2 = "0.11"
base64 = "0.22"
flate2 = "1.1"
httpdate = "1.0"
libc = "0.2"
# Art resizing (/api/v1/art/{id}?w=); flux-meta already builds this crate.
# WebP: images agents add (art.add) often are.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# The agent contract's JSON Schemas (agent), lens checks, lens ids.
schemars.workspace = true
regex = "1.12"
unicode-normalization = "0.1.26"
# Only to point SQLite's allocator at jemalloc (same crate as flux-catalog's).
rusqlite = { workspace = true, optional = true }

[target.'cfg(not(windows))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }
tikv-jemalloc-sys = { workspace = true, optional = true }

# Win32 calls (src/win32.rs): Ctrl-C, the job object that ends ffmpeg with
# flux, thread priority, adapter addresses, %LOCALAPPDATA%. 0.61 is the
# version tokio already brings in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

# Tests seed catalogs the way flux-scan will (examples/pipeline_smoke.rs):
# flux-names + flux-probe straight into flux-catalog.
[dev-dependencies]
# Corpus (FLUX_TEST_MEDIA), bench output (FLUX_BENCH_RESULTS) and clips
# made with ffmpeg.
flux-test-media = { path = "../flux-test-media" }
tempfile = "3.27"
http-body-util = "0.1"
flux-probe.workspace = true
flux-names.workspace = true

[[example]]
name = "probe_vs_index"
# Also run its #[test] (feature clips) under `cargo test`.
test = true

[[example]]
name = "server_bench"
