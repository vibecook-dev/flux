# flux's settings, for the system service (flux.service). Each key is a
# flux-server flag with `_` in place of `-` (`flux-server --help`). After a
# change: `sudo systemctl restart flux`. Commands that ask the running flux
# take the same file: `sudo -u flux flux-server owner-link --config
# /etc/flux/flux.toml`.
# https://github.com/vibecook-dev/flux/blob/main/docs/INSTALL.md

# The catalog, artwork and caches (systemd makes it, for the flux account).
data_dir = "/var/lib/flux"

# Other devices on the network reach flux at this address. Without it, only
# this machine does: open http://localhost:8096 here, or forward the port
# over SSH (`ssh -L 8096:127.0.0.1:8096 <this machine>`).
# lan = "0.0.0.0:8097"

# If other people log in to this machine, don't take their browsers for
# flux's owner (set flux up with an owner link: `flux-server owner-link`).
# localhost_role = "none"

# Libraries can be added in the browser (Set up flux), or here. The `flux`
# account needs to read their folders.
# [[library]]
# name = "Films"
# kind = "movies"            # movies | shows | mixed | videos
# path = "/srv/media/films"
