# flux's settings, for flux.app. Each key is a flux-server flag with `_` in
# place of `-` (`flux-server --help`). After a change, choose Restart flux
# from the flux icon in the menu bar.
# https://github.com/vibecook-dev/flux/blob/main/docs/INSTALL.md#the-macos-app

# Other devices on the network reach flux at this address (macOS asks once
# whether flux may find devices on the local network). Without it, only this
# Mac does: http://localhost:8096.
# lan = "0.0.0.0:8097"

# If other people log in to this Mac, don't take their browsers for flux's
# owner (set flux up with an owner link: `flux-server owner-link`).
# localhost_role = "none"

# Libraries can be added in the browser (Set up flux), or here.
# [[library]]
# name = "Films"
# kind = "movies"            # movies | shows | mixed | videos
# path = "/Volumes/Media/Films"
